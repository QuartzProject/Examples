org.gradle.jvmargs=-Xmx1g
org.gradle.workers.max=4
kotlin.code.style=official
paperApiVersion=26.3.build.256-stable

# Nothing of Quartz is published yet, so the build takes it from checkouts (pass these with -P, or set them here):
#   quartz.embed    the Embed checkout; ../../Embed (the sibling clone) when unset
#   quartz.jvm      the JVM bindings of the core, <Quartz>/bindings/jvm
#   quartz.library  a libquartz built from the core (cmake -DQUARTZ_SHARED=ON), packed into the plugin jar
